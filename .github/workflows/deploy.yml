name: Build & Deploy KOMPAN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site (zero npm dependencies)
        run: node scripts/build.js

      - name: Check internal links
        run: node scripts/check-links.js

      - name: Stage deployable files
        run: |
          mkdir -p _site
          # Salin seluruh hasil build (halaman statis + output Markdown) ke _site
          rsync -a --prune-empty-dirs \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'content' \
            --exclude 'scripts' \
            --exclude 'server' \
            --exclude 'node_modules' \
            --exclude '_site' \
            --exclude 'package.json' \
            --exclude 'README.md' \
            ./ _site/
          test -f _site/index.html
          test -f _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
